  explanation: No county has an association-membership ingest. The query-table column is a schema-stability placeholder, not a missed Duval transform.
  evaluated_sources:
    - source: Florida DBPR condominium and managing-entity public records
      url: https://www2.myfloridalicense.com/condos-timeshares-mobile-homes/public-records/
      fit: association identity and management candidates
      blocker: no complete authoritative parcel-membership or authoritative-negative contract
    - source: FloridaCommerce Official List of Special Districts
      url: https://www.floridajobs.org/community-planning-and-development/special-districts/special-district-accountability-program/official-list-of-special-districts
      fit: CDD identity and district boundary provenance
      blocker: The list identifies districts but does not provide centralized parcel boundaries; CDD coverage is not HOA membership and must not set hoa_flag
    - source: City of Jacksonville GIS or Clerk records
      fit: requested source for parcel-level membership or boundaries
      blocker: no reviewed complete parcel-linkable publication available in the runtime
  lexicon_mapping:
    vertices:
      - common_interest_community
      - community_association
      - community_development_district
      - company
    relationships:
      - association_governs_community
      - property_has_association_membership
      - property_within_cdd
      - company_manages_association
    rules:
      - hoa_flag true requires effective authoritative parcel membership
      - hoa_flag false requires complete authoritative negative coverage
      - partial, candidate, management-only, and CDD-only evidence remains null
  blocker:
    owner: Oracle Data Partnerships
    missing_requirement: Complete parcel-linkable source, publication rights, and Lexicon owner approval
    next_action: Request DBPR/public-records access plus Jacksonville GIS or Clerk parcel records, then route the reusable schema through the Lexicon owner

